# AWS Load Balancer Controller Gateway API resources
# Namespace: default
# Existing backend Service: enterprise-rag-api (port 80)

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: enterprise-rag-targets
  namespace: default
spec:
  # No targetReference: this is a Gateway-level default configuration.
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /health/live
      healthCheckProtocol: HTTP
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: enterprise-rag-alb-config
  namespace: default
spec:
  scheme: internet-facing
  defaultTargetGroupConfiguration:
    name: enterprise-rag-targets
  # Add wafV2.webACL after provisioning, using:
  # terraform -chdir=infrastructure/terraform output -raw waf_web_acl_arn
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: enterprise-rag-gateway
  namespace: default
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: enterprise-rag-alb-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: enterprise-rag-route
  namespace: default
spec:
  parentRefs:
    - name: enterprise-rag-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: enterprise-rag-api
          port: 80
