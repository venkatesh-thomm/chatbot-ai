
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-api
  namespace: default
  labels:
    app: enterprise-rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-rag-api
  template:
    metadata:
      labels:
        app: enterprise-rag-api
    spec:
      serviceAccountName: enterprise-rag-api
      containers:
        - name: fastapi
          image: 210006515453.dkr.ecr.us-east-1.amazonaws.com/enterprise-rag-dev-api:dev-20261101-02
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "dev"
            - name: AWS_REGION
              value: "us-east-1"
            - name: S3_DOCUMENTS_BUCKET
              value: "venkatesh-dem1"
            - name: OPENSEARCH_ENDPOINT
              value: "REPLACE_WITH_TERRAFORM_OPENSEARCH_COLLECTION_ENDPOINT"
            - name: BEDROCK_EMBEDDING_MODEL_ID
              value: "amazon.titan-embed-text-v2:0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20


---


apiVersion: v1
kind: Service
metadata:
  name: enterprise-rag-api
  namespace: default
  labels:
    app: enterprise-rag-api
spec:
  type: ClusterIP
  selector:
    app: enterprise-rag-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
