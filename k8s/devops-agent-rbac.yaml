apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-agent-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-agent-pod-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: enterprise-rag-api
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-agent-pod-reader
